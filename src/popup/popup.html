<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Autofill</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <header class="bar">
      <h1>Job Autofill</h1>
      <a id="open-options" href="#">Edit profile</a>

    <p id="hint" class="notice" hidden></p>

    <div class="actions">
      <button id="preview" class="btn">Preview</button>
      <button id="fill" class="btn primary">Fill this page</button>

    <footer class="foot">Nothing is submitted for you. Review each step, then continue. Shortcut: <kbd>Alt+Shift+F</kbd></footer>
